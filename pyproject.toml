[tool.coverage.run]
source = ["template_app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
# Exemptions 1-4 from docs/standards/pipeline-testing.md §3 (glue,
# properties, dunder reprs, pure re-exports) — lifted from
# aw-backend/src/tests/.coveragerc, the precedent that section names, same
# as the aw-app-kb pilot (card 3d65bf3b-9510-8173-b347-d834e37aeedf).
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
show_missing = true
precision = 1
# Hard 80% gate, not the estate's baseline+ratchet default (§4.2) — explicit
# request from Frederico for the template specifically, since it is the
# reference every new aw-app-* is born from and §4.2 point 5 already starts
# every NEW app at 80%. Measured baseline at adoption (2026-09-09) was 74%
# (template_app/plugin.py at 0%); new tests in tests/test_plugin.py and
# tests/test_main.py brought it to 99%. May only rise from here.
fail_under = 80
