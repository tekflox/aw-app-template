[tool.ruff]
line-length = 100
target-version = "py311"  # Tier A CI runs Python 3.11 (docs/standards/pipeline-testing.md §1.4)

[tool.ruff.lint]
# Pinned explicitly, not left at ruff's defaults: ruff's default rule set
# drifts across versions (measured — v0.9.9, the aw-app-kb pilot's pin, and
# current v0.17.3 disagree on what to flag; 0.17.3 defaults additionally
# raise ASYNC/PLW/SIM/EXE/RUF-class findings 0.9.9 never did). An explicit
# select here is defaults-equivalent (E4,E7,E9,F) plus I for import sorting,
# so a future hook `rev` bump cannot silently change gate semantics — only a
# deliberate widening of this list can. See docs/standards/pipeline-testing.md
# §6b.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]

[tool.pylint.main]
py-version = "3.11"
# The blocking E-class gate (--disable=all --enable=E --disable=E0401,E1101)
# lives on the hook/CI command line, not here — same as aw-app-kb and CI.
# rcfile disable/enable ordering between [MESSAGES CONTROL] sections and a
# command-line --enable/--disable is ambiguous (which one wins depends on
# argument order pylint itself doesn't document), so the gate's effective
# rule set must not depend on it. Do NOT move the gate into this rcfile.

[tool.coverage.run]
source = ["template_app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
# Exemptions 1-4 from docs/standards/pipeline-testing.md §3 (glue,
# properties, dunder reprs, pure re-exports) — lifted from
# aw-backend/src/tests/.coveragerc, the precedent that section names, same
# as the aw-app-kb pilot (card 3d65bf3b-9510-8173-b347-d834e37aeedf).
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
show_missing = true
precision = 1
# Hard 100% gate, not the estate's baseline+ratchet default (§4.2) — explicit
# request from Frederico for the template specifically, since it is the
# reference every new aw-app-* is born from and is meant to be the quality
# bar other aw-app-* repos are measured against (card
# 3d75bf3b-9510-8172-a929-c1fe4e60254c). Measured baseline at adoption
# (2026-09-09) was 74% (template_app/plugin.py at 0%); the 80%-gate sibling
# card (3d65bf3b-9510-818c-93ff-ef6bd0740446) brought it to a measured 100%
# (tests/test_plugin.py, tests/test_main.py — real behavior asserted, not
# import-only stubs) with no remaining line that isn't covered by either a
# real test or one of the exclude_lines exemptions above. The gate was still
# pinned at 80 even though the measured number was already 100 — raising it
# here just makes the gate match reality and locks in the ratchet: never
# lower this without a documented reason.
fail_under = 100
