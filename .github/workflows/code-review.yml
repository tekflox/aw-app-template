name: Code Review

# Deep PR review by the Dev Team's own reviewer agent (`code-reviewer-sonnet`),
# published as the commit status `devteam/code-review` on the PR's head SHA.
# ADVISORY BY DESIGN, same standing rule as `devteam/ai-review`: no single
# automated reviewer is the authority, and this is never promoted to a
# required check on its own.
#
# This file is deliberately SEPARATE from ai-review.yml, not a job inside it.
# ai-review.yml's concurrency group is evaluated at the WORKFLOW level, before
# any job `if` — the exact mechanism behind the 809a1a6 incident, where
# CodeRabbit's own auto-comment landed in that group and cancelled PR-Agent's
# in-flight run. A job here would either inherit that same group (reintroduce
# the bug) or need to move it to job level (a semantic change to a file that
# already burned once). A separate file sidesteps both: its own concurrency
# group below shares no prefix with ai-review's, so that cancellation class is
# impossible between the two BY CONSTRUCTION, not by care. ai-review.yml is
# not touched by this change at all.
#
# Trigger surface deliberately excludes `synchronize`: a full deep review
# (one judge run plus up to 3 research runs) costs real subscription budget,
# and PR-Agent already reviews every push. Re-triggering after further pushes
# is `/aw-review` on demand, not automatic — see the aw-agent-code-reviewer
# skill's "PR deep-review entry path" section if that trade-off ever needs
# revisiting (comment there, don't just flip this trigger by hand).
#
# `/aw-improve` is the lighter-weight sibling command, same gate and same
# judge: it asks for the improvement-suggestion half of the review only, and
# tells the judge to skip the dependency/CVE research lens unless the diff
# genuinely needs it. Not a separate workflow, not a separate output schema
# — just a narrower dispatch message (see `mode` below and the skill
# section). Improvement suggestions themselves are NOT gated behind this
# command; they're part of the judge's normal output on every trigger here,
# `/aw-improve` only exists to re-run that half on demand without a new PR
# event.
#
# No actions/checkout here either, for the same reason ai-review.yml has
# none: this workflow never touches PR content directly, only GitHub's own
# API (gate decision, status, comments). The judge agent reads the actual
# diff from ITS OWN session, where the real repo is already checked out on
# this workspace — seeing untrusted fork code never depends on what this
# runner does.
#
# ── THE TWO-ROUND REVIEW→MERGE LOOP ───────────────────────────────────────
# (Kanban "Apply PR-first flow to aw-app-template", Architect design §1-§5
# plus its addendum A1/A2. This file owns the whole loop.)
#
# Round state lives ON THE PR, as two labels, and that is an explicit state
# machine rather than a count heuristic:
#
#   (no label)                -> round 1: normal review, all lenses.
#                                >=1 finding  -> label `devteam:awaiting-fixes`,
#                                                POST `findings` (wakes the coder
#                                                that opened the PR).
#                                0 findings   -> merge.
#   devteam:awaiting-fixes     -> round 2: the lenient "major only" lens. Merge
#                                eligibility is per-finding `blocks_merge`, NOT
#                                severity (A1).
#                                none blocking -> merge.
#                                any blocking  -> label `devteam:needs-human`,
#                                                 POST `escalate`. No round 3.
#   devteam:needs-human        -> TERMINAL. Further reviews are informational
#                                only: no label change, no merge, no event. A
#                                human removes the label to re-arm the machine.
#
# Why labels and not commit counts or status history: `/aw-review` can be
# invoked any number of times, workflow runs get cancelled and re-run, and a
# round-2 merge step can fail mechanically and be retried. Labels encode
# STATE; counts and history encode the past and break on exactly those
# re-runs. The gate reads them LIVE via `gh api` — never from the event
# payload, whose `issue_comment` form carries a stale label snapshot.
#
# `devteam/ai-review` (PR-Agent) does NOT participate in merge eligibility in
# either round. Its commit status is run-HEALTH, not a verdict: ai-review.yml
# maps the PR-Agent step's outcome to the state, so `success` means "the
# review completed" whether it found twenty issues or none. Its findings still
# reach the coder — as prose, via the wake prompt, which tells the coder to
# triage both reviewers' comments.
#
# `/aw-improve` stays OUTSIDE the round machine (round=informational): it is a
# re-run of the suggestion half, not a review round, and it must not consume
# round 1 or trigger a merge.
#
# ── ONE TRAP, IF YOU ARE EDITING *THIS FILE* IN A PR ──────────────────────
# The two rounds do not necessarily run the same version of this file.
#
#   * Round 1 arrives on `pull_request`, which runs the workflow as it exists
#     ON THE PR — your edits take effect immediately.
#   * Round 2 arrives on `issue_comment` (`/aw-review`), and `issue_comment`
#     is NOT a pull-request event: GitHub runs the DEFAULT BRANCH's copy of
#     this file. Your edits are invisible to it until they are merged.
#
# Measured on PR #13, the PR that introduced this loop: its round-1 run had
# `headBranch=devteam/two-round-review-merge`, its round-2 run had
# `headBranch=master, headSha=3fe2263` — master's copy, which had no round
# logic at all, so round 2 silently behaved like a plain pre-loop review: no
# round detection, no label change, no merge, no event. Nothing failed; the
# three steps simply were not in the file that ran.
#
# This is a property of GitHub's trigger model, not something to fix here,
# and it is harmless in steady state (both rounds run master's copy). It
# matters in exactly one case: a PR that MODIFIES this file cannot exercise
# its own round 2. Verify that half another way — the eligibility and
# round-detection scripts are extractable and drivable offline, which is how
# PR #13 covered it — and expect the first real round 2 to be the one after
# the merge.

on:
  pull_request:
    # `closed` is here only for the merged-event job at the bottom of this
    # file; the gate job below explicitly excludes it so a close never
    # dispatches a review.
    types: [opened, reopened, ready_for_review, closed]
  issue_comment:
    types: [created]

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  # Same two-entry-path shape as ai-review.yml's gate (fork check on both
  # paths, first-token command parse, comment body via env never
  # interpolated into the shell) — see that file's own comments for why each
  # piece is there. The one addition: an author allowlist, narrower than the
  # fork check and layered on top of it, not instead of it.
  gate:
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.action != 'closed' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(
            fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.comment.author_association
          )
        )
      )
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.decide.outputs.allowed }}
      sha: ${{ steps.decide.outputs.sha }}
      base: ${{ steps.decide.outputs.base }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      mode: ${{ steps.decide.outputs.mode }}
      round: ${{ steps.decide.outputs.round }}
      is_draft: ${{ steps.decide.outputs.is_draft }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never interpolated into the script body — a comment
          # body is attacker-controlled text (same rationale as ai-review.yml).
          BODY: ${{ github.event.comment.body }}
          # Comma-separated GitHub logins, `gh variable set` (no commit) --
          # see this workflow's own trailing comment for the exact command.
          # Unset resolves to `fredericowu` HERE, in code, never to "nobody"
          # or "everyone" (the allowlist-unset-ships-green-and-invisible
          # failure mode is documented in the KB).
          TRUSTED_AUTHORS: ${{ vars.AW_REVIEW_TRUSTED_AUTHORS }}
        run: |
          set -euo pipefail
          allowlist="${TRUSTED_AUTHORS:-fredericowu}"

          is_trusted() {
            local login="$1" entry
            IFS=',' read -ra arr <<< "$allowlist"
            for entry in "${arr[@]}"; do
              entry="$(echo "$entry" | xargs)"
              [ "$entry" = "$login" ] && return 0
            done
            return 1
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_number="${{ github.event.pull_request.number }}"
            sha="${{ github.event.pull_request.head.sha }}"
            base="${{ github.event.pull_request.base.ref }}"
            author="${{ github.event.pull_request.user.login }}"
            is_draft="${{ github.event.pull_request.draft }}"
            mode=review
          else
            # Same first-whitespace-token matching as ai-review.yml's gate,
            # and the same reason: startsWith('/aw-review') would also match
            # "/aw-reviewing this later", spending a run on a sentence.
            # /aw-improve is the lighter-weight sibling command -- same gate,
            # same judge, just a narrower focus (see the aw-agent-code-reviewer
            # skill's "PR deep-review entry path" for what `mode` changes).
            cmd="$(printf '%s' "$BODY" | head -n 1 | tr -d '\r' | awk '{print $1}')"
            case "$cmd" in
              /aw-review) mode=review ;;
              /aw-improve) mode=improve ;;
              *)
                echo "Not a review command: '$cmd'"
                echo "allowed=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac

            pr="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")"
            head_repo="$(printf '%s' "$pr" | jq -r '.head.repo.full_name // ""')"
            if [ "$head_repo" != "${{ github.repository }}" ]; then
              {
                echo "### Code review skipped: \`$cmd\` on a fork PR"
                echo
                echo "This pull request's head is \`${head_repo:-a deleted fork}\`, not"
                echo "\`${{ github.repository }}\`. An \`issue_comment\` run has access to"
                echo "this repository's secrets regardless of where the PR came from, so"
                echo "running the credentialed reviewer here would send it over a diff"
                echo "this repository does not control. Declined deliberately."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pr_number="${{ github.event.issue.number }}"
            sha="$(printf '%s' "$pr" | jq -r .head.sha)"
            base="$(printf '%s' "$pr" | jq -r .base.ref)"
            author="$(printf '%s' "$pr" | jq -r .user.login)"
            is_draft="$(printf '%s' "$pr" | jq -r '.draft')"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

          # ---- round, from the PR's LIVE labels ----
          # `gh api`, never `github.event.*.labels`: an issue_comment payload
          # carries the label set as it was when the comment was written, so a
          # label this very loop added on the previous round can be missing
          # from it. Reading it live is the difference between a round-2 pass
          # and silently re-running round 1 forever.
          #
          # This fetch FAILS LOUDLY, with retries, and never falls back to an
          # empty label set. The first version swallowed errors
          # (`2>/dev/null || true`), which meant a rate limit or a network
          # blip produced "" -> round=1 on a PR actually carrying
          # `devteam:awaiting-fixes` or `devteam:needs-human`: a mid-escalation
          # PR silently reset to a fresh round 1, re-dispatching a full review
          # instead of the lenient lens and, worst case, cycling
          # coder-wake/re-review without ever reaching merge or escalation,
          # because each retry can hit the same transient failure. Caught by
          # PR-Agent on PR #13. Empty output is a legitimate answer here (a PR
          # with no labels), so "no labels" and "could not read the labels"
          # cannot be allowed to look the same.
          labels=""
          for attempt in 1 2 3; do
            if labels="$(gh api "repos/${{ github.repository }}/issues/$pr_number/labels" \
                           --jq '.[].name')"; then
              break
            fi
            echo "label fetch attempt $attempt failed"
            labels="__FETCH_FAILED__"
            sleep $(( attempt * 3 ))
          done
          if [ "$labels" = "__FETCH_FAILED__" ]; then
            echo "::error::could not read PR #$pr_number's labels after 3 attempts. \
            Refusing to guess the review round: defaulting to round 1 would reset a PR \
            that is mid-fix-cycle or already escalated. Re-run this workflow once the \
            GitHub API is answering again."
            exit 1
          fi
          has_label() { printf '%s\n' "$labels" | grep -Fxq "$1"; }

          if [ "$mode" = "improve" ]; then
            # /aw-improve is a suggestion re-run, not a review round. It must
            # not consume round 1, must not set a label, and must not merge.
            round=informational
          elif has_label "devteam:needs-human"; then
            # Terminal until a human removes the label. The review still runs
            # and still posts its findings — it just cannot change state.
            round=needs-human
          elif has_label "devteam:awaiting-fixes"; then
            round=2
          else
            round=1
          fi
          echo "round=$round" >> "$GITHUB_OUTPUT"
          # Draft state gates the MERGE, not the review: reviewing a WIP draft
          # early is the point, un-drafting and merging it is not. See the
          # eligibility step and the merge step's own live re-check.
          echo "is_draft=${is_draft:-false}" >> "$GITHUB_OUTPUT"
          echo "round=$round is_draft=${is_draft:-false} (labels: $(printf '%s' "$labels" | tr '\n' ' '))"

          if ! is_trusted "$author"; then
            {
              echo "### Deep review skipped: \`$author\` is not a trusted author"
              echo
              echo "\`AW_REVIEW_TRUSTED_AUTHORS\` is \`$allowlist\`. This narrows"
              echo "same-repo pushes to reviewers worth the credentialed run's"
              echo "budget — \`devteam/ai-review\` still runs for everyone."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  code-review:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    # Hard ceiling on a dead/stalled judge — paired with the server-side 900s
    # runner timeout on the dispatch call below and the always()-finalize
    # step, so `devteam/code-review` can never stay `pending` forever.
    timeout-minutes: 20
    steps:
      - name: Mark code review pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ needs.gate.outputs.sha }}" \
            -f state=pending \
            -f context=devteam/code-review \
            -f description="Dev Team deep review in progress" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --silent

      # Agent-scoped AP-MT ApiKey, workspace-bound to `aw`, scoped to
      # `code-reviewer-sonnet` alone — same minting pattern as
      # AW_PRAGENT_V1_KEY. A leak can only dispatch this one agent.
      #
      # `curl --max-time 960` outlives the server-side 900s runner ceiling on
      # purpose, so a slow-but-alive run gets its own answer back rather than
      # this step timing out first and masking it as a dispatch failure.
      #
      # The message body is plain coordinates, no [SYSTEM] framing and no
      # anti-refusal wording: AP-MT's /v1 door injects this text as a USER
      # turn, and anti-refusal boilerplate has caused refusals here before
      # (documented in the KB). Everything tunable about the review itself
      # (lenses, budget, output schema, comment-placement rule, bot-identity
      # banner) lives in the aw-agent-code-reviewer skill's "PR deep-review
      # entry path" section, not here — so tuning it needs `update_skill`,
      # never a commit to this file.
      - name: Dispatch Code Reviewer - Sonnet
        id: dispatch
        env:
          AW_CODEREVIEW_V1_KEY: ${{ secrets.AW_CODEREVIEW_V1_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          BASE_REF: ${{ needs.gate.outputs.base }}
          MODE: ${{ needs.gate.outputs.mode }}
          ROUND: ${{ needs.gate.outputs.round }}
        run: |
          set -euo pipefail
          # mode=improve is /aw-improve: same judge, same budget, just a
          # narrower ask appended to the dispatch message -- the output
          # schema and comment-placement rule do not change (see the skill's
          # "PR deep-review entry path"). Nothing below reads MODE except
          # this one extra sentence.
          #
          # ROUND=2 adds one more: the lenient "major only" lens. Deliberately
          # a POINTER to the skill section, not the lens text itself -- the
          # same rule as every other tunable here, so the lens can change via
          # `update_skill` with no commit to this file. The round-2 schema
          # addition (`blocks_merge`) is named in the message because the
          # eligibility step below hard-depends on it and fails CLOSED when it
          # is missing; a judge that never heard of the field would therefore
          # escalate every round-2 PR.
          payload="$(jq -n \
            --arg repo "$REPO" --arg pr "$PR_NUMBER" \
            --arg sha "$HEAD_SHA" --arg base "$BASE_REF" --arg mode "$MODE" \
            --arg round "$ROUND" \
            '{
              model: "agent/code-reviewer-sonnet",
              messages: [{role: "user", content: (
                "PR deep review. Repo: " + $repo + ". PR #" + $pr +
                ". Head SHA: " + $sha + ". Base ref: " + $base +
                ". Round: " + $round + ". " +
                (if $round == "2" or $round == "needs-human" then
                  "This is a ROUND 2 review: the coder has already addressed " +
                  "round 1 and pushed fixes. Follow the \"Round 2: the " +
                  "major-only lens\" section of the aw-agent-code-reviewer " +
                  "skill, in addition to the entry-path section below. Your " +
                  "JSON must include the required per-finding boolean " +
                  "`blocks_merge` that section defines. Read the coder'\''s " +
                  "\"Won'\''t do:\" replies on the PR as input before judging " +
                  "a finding they declined. " +
                  (if $round == "needs-human" then
                    "NOTE: this PR already carries the `devteam:needs-human` " +
                    "label, so this run is informational only -- it will not " +
                    "merge and will not change any label. Review it anyway " +
                    "and post your findings. "
                  else "" end)
                else "" end) +
                (if $mode == "improve" then
                  "Triggered via /aw-improve: focus this run specifically " +
                  "on producing improvement suggestions for the current " +
                  "diff (the normal `suggestion` output field), not a full " +
                  "lens sweep. Do not spin up the dependency/CVE research " +
                  "lens unless the diff genuinely needs it (e.g. a new or " +
                  "bumped dependency) -- this is about code-level " +
                  "improvement, not research. "
                else "" end) +
                "Follow the aw-agent-code-reviewer skill'\''s " +
                "\"PR deep-review entry path\" section for the full " +
                "contract (lenses, budget, output JSON schema, comment " +
                "placement). Your final message must be only the JSON " +
                "object described there."
              )}]
            }')"
          http_code="$(curl -sS --max-time 960 -o "$RUNNER_TEMP/dispatch_response.json" \
            -w '%{http_code}' \
            -X POST "https://agents-platform.aw.tekflox.com/v1/chat/completions" \
            -H "Authorization: Bearer $AW_CODEREVIEW_V1_KEY" \
            -H "Content-Type: application/json" \
            --data-binary "$payload")"
          echo "dispatch HTTP $http_code"
          cat "$RUNNER_TEMP/dispatch_response.json"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::dispatch failed with HTTP $http_code"
            exit 1
          fi

      # The judge never calls `gh` to post its own review (see the skill
      # section it was dispatched to follow): its session's `gh` is the
      # SAME shared personal credential every Dev Team agent reads/writes
      # the repo with, so a comment posted through it would render as
      # Frederico's own GitHub account, not as an automated reviewer — the
      # opposite of what a distinct bot identity is for. This step parses
      # the judge's returned JSON and posts every comment itself, under
      # `secrets.GITHUB_TOKEN` (renders as `github-actions[bot]`, the SAME
      # bot PR-Agent uses — but with a distinct banner so the two are not
      # mistaken for each other on the PR).
      - name: Post findings and prepare the status description
        id: findings
        if: always() && steps.dispatch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          ROUND: ${{ needs.gate.outputs.round }}
          IS_DRAFT: ${{ needs.gate.outputs.is_draft }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json
          import os
          import re
          import subprocess
          import sys

          # RUNNER_TEMP, not a hardcoded /tmp path: this self-hosted runner
          # can process more than one job's /tmp at once (two PRs reviewed
          # around the same time, or this job racing the Test workflow's own
          # pytest run on the same push) -- a bare /tmp/devteam_*.json name
          # is shared host state two concurrent jobs can clobber. RUNNER_TEMP
          # is unique per job even on a self-hosted runner.
          TMP = os.environ["RUNNER_TEMP"]

          raw = json.load(open(os.path.join(TMP, "dispatch_response.json")))
          content = raw["choices"][0]["message"]["content"]

          # Strip a markdown fence by matching the OPENING fence's own
          # backtick run against the CLOSING one, not a naive text[3:-3]
          # slice -- a fence can open with 4+ backticks (documented gotcha:
          # the judge wraps its JSON in a fence no matter how firmly asked
          # not to). re.search, not re.match: the judge routinely prefixes
          # the fence with a sentence of prose ("Here is my review:"), and
          # an anchored match would miss the fence entirely on exactly that
          # input, falling through to a brace-scan over the prose too.
          # Falls back to scanning for the outermost {...} only when there
          # is truly no fence anywhere in the message.
          body = content
          fence = re.search(r"(`{3,})[^\n]*\n(.*?)\n\1`*", content, re.S)
          if fence:
              body = fence.group(2)
          start, end = body.find("{"), body.rfind("}")
          if start == -1 or end == -1:
              print("::error::no JSON object found in the judge's response")
              print(content[:2000], file=sys.stderr)
              sys.exit(1)
          data = json.loads(body[start:end + 1])

          repo = os.environ["REPO"]
          pr = os.environ["PR_NUMBER"]
          sha = os.environ["HEAD_SHA"]
          banner = (
              "\U0001F50E **Dev Team Code Review** — automated deep "
              "review by `code-reviewer-sonnet`, not PR-Agent."
          )

          findings = data.get("findings") or []
          for f in findings:
              sev = str(f.get("severity", "info")).upper()
              conf = f.get("confidence", "possible")
              klass = f.get("class", "diff_local")
              text = f"{banner}\n\n**[{sev}/{conf}/{klass}]** {f.get('title', '')}\n\n{f.get('body', '')}"
              evidence = f.get("evidence")
              if evidence:
                  text += f"\n\n_Evidence: {evidence}_"

              path, line = f.get("file"), f.get("line")
              # `suggestion` is the raw replacement text for lines
              # line_start..line, nothing else -- only meaningful anchored to
              # a real hunk, so it's ignored on a cross-cutting finding (no
              # path/line). Wrapped in a ```suggestion fence, this renders as
              # GitHub's native one-click-applicable diff, the same mechanism
              # CodeRabbit already uses on this repo (not PR-Agent's own
              # /improve, which -- verified live on this repo -- posts a
              # prose table with a plain ```diff block instead of a real
              # suggestion-block comment).
              suggestion = f.get("suggestion")
              if suggestion and path and line:
                  # Same reasoning as the judge-response fence match above:
                  # don't hardcode a 3-backtick fence -- if `suggestion`
                  # itself contains a ``` run (plausible for a diff touching
                  # markdown/YAML/heredoc files, this file included), a fixed
                  # fence breaks. Open/close with one more backtick than the
                  # longest run found inside the text, floor 3.
                  longest_run = max((len(m) for m in re.findall(r"`+", suggestion)), default=0)
                  sugg_fence = "`" * max(longest_run + 1, 3)
                  text += f"\n\n{sugg_fence}suggestion\n{suggestion}\n{sugg_fence}"

              if path and line:
                  # Line-anchored finding -> inline review comment on that
                  # hunk (pulls/{pr}/comments), same mechanism PR-Agent and
                  # CodeRabbit already use on this repo.
                  cmd = [
                      "gh", "api", f"repos/{repo}/pulls/{pr}/comments",
                      "-f", f"body={text}", "-f", f"commit_id={sha}",
                      "-f", f"path={path}", "-F", f"line={int(line)}",
                      "-f", "side=RIGHT",
                  ]
                  line_start = f.get("line_start")
                  # GitHub's REST API requires start_line < line strictly --
                  # a reversed/equal range from the judge 422s. Drop to a
                  # single-line suggestion at `line` rather than send one.
                  if line_start and int(line_start) < int(line):
                      cmd += ["-F", f"start_line={int(line_start)}",
                              "-f", "start_side=RIGHT"]
              else:
                  # Cross-cutting finding -> a normal top-level PR comment,
                  # never force-fit onto a line it isn't really about.
                  cmd = ["gh", "api", f"repos/{repo}/issues/{pr}/comments",
                         "-f", f"body={text}"]

              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode != 0:
                  # An inline anchor 422s when that line isn't part of the
                  # diff (stale hunk, renamed file) -- fall back to a
                  # top-level comment rather than silently losing the
                  # finding.
                  print(f"::warning::inline comment failed, falling back to "
                        f"top-level: {result.stderr[:300]}")
                  fallback_text = text + f"\n\n_(anchored at {path}:{line} originally)_"
                  subprocess.run(
                      ["gh", "api", f"repos/{repo}/issues/{pr}/comments",
                       "-f", f"body={fallback_text}"],
                      check=True,
                  )

          counts = data.get("counts") or {}
          parts = [f"{v} {k}" for k, v in counts.items() if v]
          desc = ("; ".join(parts) or "no findings")[:140]

          # ---- merge eligibility, and the digest the AP-MT event carries ----
          #
          # Round 1: eligible iff there are NO findings at all. Any finding
          # wakes the coder instead.
          #
          # Round 2: eligible iff no finding has `blocks_merge == true`. That
          # boolean — not severity — is the gate, because Frederico's
          # definition of "major" is behavioural ("it will break the
          # application or security risk") and severity is a reviewer
          # taxonomy that can disagree with that test in BOTH directions: a
          # severity=high style concern that breaks nothing, a severity=medium
          # real security hole. Severity stays in the schema and still drives
          # the comment labels, the counts and this status description; it
          # just no longer decides anything.
          #
          # FAIL CLOSED on a missing `blocks_merge`: a round-2 finding without
          # the field counts as blocking. The failure mode of schema drift is
          # then an escalation a human looks at, never a silent merge over an
          # unjudged finding.
          round_ = os.environ.get("ROUND", "1")

          def _digest(items):
              out = []
              for f in items:
                  out.append({"title": (f.get("title") or "")[:300],
                              "severity": f.get("severity"),
                              "file": f.get("file"),
                              "line": f.get("line"),
                              "blocks_merge": f.get("blocks_merge")})
              return out

          blocking = []
          missing_field = 0
          if round_ == "2":
              for f in findings:
                  if "blocks_merge" not in f:
                      missing_field += 1
                      blocking.append(f)
                  elif bool(f.get("blocks_merge")):
                      blocking.append(f)

          if round_ == "1":
              eligible = not findings
          elif round_ == "2":
              eligible = not blocking
          else:
              # informational / needs-human: never eligible, by definition.
              eligible = False

          # A DRAFT PR is never merge-eligible, whatever the review said.
          # `opened` fires for a PR created as a draft (`ready_for_review` is
          # the separate later event, not a replacement), so without this a
          # trusted author opening a WIP draft that happens to review clean
          # got it un-drafted and squash-merged to master without ever saying
          # it was ready — the one signal that exists to prevent exactly that.
          # Caught on PR #13 by the reviewer this loop dispatches. Reviewing a
          # draft stays useful and still happens; only the merge is withheld,
          # and marking it ready_for_review re-triggers a fresh round 1.
          if eligible and os.environ.get("IS_DRAFT", "").lower() == "true":
              eligible = False
              print("::notice::PR is a DRAFT — review complete, merge withheld. "
                    "Mark it ready for review to re-run round 1 and merge.")

          if missing_field:
              print(f"::warning::{missing_field} round-2 finding(s) have no "
                    f"`blocks_merge` field — counted as BLOCKING (fail closed). "
                    f"Check the round-2 lens section of the aw-agent-code-reviewer skill.")

          with open(os.path.join(TMP, "devteam_findings.json"), "w") as fh:
              json.dump(_digest(findings), fh)
          with open(os.path.join(TMP, "devteam_blocking.json"), "w") as fh:
              json.dump(_digest(blocking), fh)
          with open(os.path.join(TMP, "devteam_counts.json"), "w") as fh:
              json.dump(counts, fh)

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"desc={desc}\n")
              gh_out.write(f"findings_count={len(findings)}\n")
              gh_out.write(f"blocking_count={len(blocking)}\n")
              gh_out.write(f"missing_blocks_merge={missing_field}\n")
              gh_out.write(f"eligible={'true' if eligible else 'false'}\n")
          print(f"round={round_} findings={len(findings)} blocking={len(blocking)} "
                f"eligible={eligible}")
          PYEOF

      # always(), same reason as ai-review.yml's own finalize step: a status
      # left on `pending` forever is indistinguishable from a queue backlog.
      # A job killed by `timeout-minutes` above still reaches this step.
      - name: Publish code-review status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          FINDINGS_OUTCOME: ${{ steps.findings.outcome }}
          DESC: ${{ steps.findings.outputs.desc }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_OUTCOME" = "success" ] && [ "$FINDINGS_OUTCOME" = "success" ]; then
            state=success
            description="${DESC:-review complete}"
          elif [ "$DISPATCH_OUTCOME" = "cancelled" ] || [ "$FINDINGS_OUTCOME" = "cancelled" ]; then
            state=error
            description="code review cancelled"
          else
            state=failure
            description="code review failed or timed out - see run log"
          fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ needs.gate.outputs.sha }}" \
            -f state="$state" \
            -f context=devteam/code-review \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --silent
          echo "devteam/code-review -> $state ($description)"

      # ---- the round state machine's one write to the PR ----
      # Only ever ADDS a label. `devteam:needs-human` is removed by a human,
      # and `devteam:awaiting-fixes` is left in place after round 2 on
      # purpose: it is what makes a later `/aw-review` round 2 again rather
      # than silently round 1. Both labels must already exist on the repo —
      # see the config block at the bottom of this file.
      - name: Set round labels
        id: labels
        # always(): the round state must not be lost because an EARLIER step
        # (the status publish, which is itself always()) hiccuped. The real
        # guard is findings.outcome — without a parsed review there is nothing
        # to label.
        if: >-
          always() && steps.findings.outcome == 'success' &&
          (needs.gate.outputs.round == '1' || needs.gate.outputs.round == '2')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUND: ${{ needs.gate.outputs.round }}
          FINDINGS_COUNT: ${{ steps.findings.outputs.findings_count }}
          BLOCKING_COUNT: ${{ steps.findings.outputs.blocking_count }}
        run: |
          set -euo pipefail
          add_label() {
            gh api -X POST \
              "repos/${{ github.repository }}/issues/${{ needs.gate.outputs.pr_number }}/labels" \
              -f "labels[]=$1" --silent
            echo "labelled: $1"
          }
          if [ "$ROUND" = "1" ] && [ "${FINDINGS_COUNT:-0}" -gt 0 ]; then
            add_label "devteam:awaiting-fixes"
          elif [ "$ROUND" = "2" ] && [ "${BLOCKING_COUNT:-0}" -gt 0 ]; then
            add_label "devteam:needs-human"
          else
            echo "no label change (round=$ROUND findings=${FINDINGS_COUNT:-0} blocking=${BLOCKING_COUNT:-0})"
          fi

      # ---- merge ----
      # `AW_DEVTEAM_MERGE_TOKEN`, a fine-grained PAT scoped to THIS repo with
      # contents:write + pull-requests:write. NOT `GITHUB_TOKEN`, and that is
      # the single most important line in this file: pushes created by
      # GITHUB_TOKEN do not trigger downstream workflows, so the merge would
      # land and `release.yml` (`on: push: branches [master]`) would silently
      # never fire. "Merge fine, release dead" is exactly the failure this
      # whole card exists to avoid, and it ships GREEN — nothing goes red, the
      # release just stops happening. A PAT-authored merge fires it.
      #
      # `--auto` so a PR whose required checks are still running merges when
      # they go green instead of failing here; it needs the repo's "Allow
      # auto-merge" setting on. Because of `--auto` the merge is often only
      # ENABLED by this step, not completed — which is why the `merged` event
      # is POSTed by the separate `merged-event` job below, on the real
      # `pull_request: closed` event, rather than guessed at here.
      #
      # ── `--auto` IS NOT A CI GATE, AND THAT IS WHY THE STEP BELOW WAITS ──
      # `--auto` only pauses for checks that BRANCH PROTECTION marks required.
      # Verified live on 2026-11-03: this repo's master has no protection at
      # all (`branches/master/protection` → 404, `rulesets` → [],
      # `required_status_checks.enforcement_level` → "off", `contexts` → []).
      # So `--auto` has nothing to wait on and merges the instant the PR is
      # mergeable — not waiting for test.yml, not for anything.
      #
      # That matters because the eligibility computed in this job reflects the
      # Dev Team REVIEWER's verdict only; it says nothing about whether the
      # test suite passed. Without the wait below, the moment
      # AW_DEVTEAM_MERGE_TOKEN lands, a PR with a real test failure that
      # happens to read clean to the reviewer squash-merges to master — which
      # `release.yml` watches unconditionally on push — and cuts a release
      # with nothing red anywhere. Silent degradation aimed at our own release
      # pipeline. Found by the reviewer this loop dispatches, on PR #13.
      #
      # So this does not depend on branch protection existing: it waits for
      # the repo's own CI on the head SHA itself, and refuses to merge unless
      # it is actually green. Item 6 (the ruleset) makes this redundant, not
      # wrong — keep it, so turning item 6 on or off cannot silently open the
      # window again.
      - name: Wait for the repo's own CI to be green on this head SHA
        id: ci_gate
        if: steps.findings.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import json, os, subprocess, sys, time

          # Pinned by name, per the design's "coder pins the exact name":
          # test.yml's job is `coverage`. Present AND passing is required —
          # "absent" must not read as "fine", or deleting the CI job would
          # silently re-open this window.
          REQUIRED = {"coverage"}
          # Our own review surfaces are advisory by standing rule and must not
          # gate the merge (devteam/code-review is this very job; waiting on
          # it would deadlock). CodeRabbit is a SaaS reviewer, also advisory.
          ADVISORY = {"devteam/ai-review", "devteam/code-review", "ai-review",
                      "code-review", "gate", "fork-notice", "merged-event",
                      "CodeRabbit"}

          repo, pr = os.environ["REPO"], os.environ["PR_NUMBER"]
          deadline = time.time() + 20 * 60

          def checks():
              out = subprocess.run(
                  ["gh", "pr", "checks", pr, "--repo", repo,
                   "--json", "name,state,bucket"],
                  capture_output=True, text=True)
              # `gh pr checks` exits non-zero when anything is failing or
              # pending, so returncode is not an error signal here — only
              # unparseable output is.
              try:
                  return json.loads(out.stdout or "[]")
              except json.JSONDecodeError:
                  print(f"::warning::could not parse gh pr checks output: "
                        f"{out.stdout[:200]} {out.stderr[:200]}")
                  return None

          while True:
              rows = checks()
              if rows is None:
                  if time.time() > deadline:
                      print("::error::could not read this PR's checks; refusing to merge")
                      sys.exit(1)
                  time.sleep(20); continue

              relevant = [r for r in rows if r.get("name") not in ADVISORY]
              pending = [r for r in relevant if r.get("bucket") == "pending"]
              failed = [r for r in relevant if r.get("bucket") in ("fail", "cancel")]
              passed = {r["name"] for r in relevant if r.get("bucket") == "pass"}

              if failed:
                  print("::error::refusing to merge — CI is not green on this head SHA: "
                        + ", ".join(f"{r['name']}={r.get('state')}" for r in failed))
                  sys.exit(1)
              if pending:
                  if time.time() > deadline:
                      print("::error::refusing to merge — still waiting on "
                            + ", ".join(r["name"] for r in pending)
                            + " after 20 min. Re-run /aw-review once CI has settled.")
                      sys.exit(1)
                  print("waiting on: " + ", ".join(r["name"] for r in pending))
                  time.sleep(20); continue

              missing = REQUIRED - passed
              if missing:
                  print(f"::error::refusing to merge — required check(s) {sorted(missing)} "
                        f"did not report a pass on this head SHA. Saw: "
                        f"{sorted((r['name'], r.get('bucket')) for r in relevant)}")
                  sys.exit(1)
              print("CI is green: " + ", ".join(sorted(passed)))
              break
          PYEOF
      - name: Merge if eligible
        id: merge
        # ci_gate must have SUCCEEDED, not merely not-failed: it is the thing
        # standing in for the required checks the ruleset does not yet enforce.
        if: steps.findings.outputs.eligible == 'true' && steps.ci_gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.AW_DEVTEAM_MERGE_TOKEN }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::AW_DEVTEAM_MERGE_TOKEN is not set on this repository. \
            Refusing to fall back to GITHUB_TOKEN: its merge push would not trigger \
            release.yml, so the release would silently stop happening."
            exit 1
          fi
          # Second, independent draft guard, re-read LIVE rather than taken
          # from the gate's snapshot: the author can mark the PR draft while
          # the review is still running (a deep review takes minutes), and
          # that is exactly the moment they most mean "do not merge this".
          # The authoritative guard is in the eligibility step; this one costs
          # one API call and closes the window that one cannot see.
          #
          # There is deliberately NO `gh pr ready` here any more. The design
          # called it a "no-op if not draft", which is true and beside the
          # point: the case where it is NOT a no-op is the one where it
          # un-drafts somebody's work-in-progress and merges it.
          if [ "$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
                    --json isDraft --jq .isDraft)" = "true" ]; then
            echo "::notice::#$PR_NUMBER became a draft since the review started — \
            not merging. Mark it ready for review to re-run round 1."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" \
            --squash --auto --delete-branch
          echo "squash auto-merge enabled on #$PR_NUMBER by AW_DEVTEAM_MERGE_TOKEN"

      # ---- tell AP-MT what this round decided ----
      # LAST, and after the findings are already on the PR: the woken coder
      # must never arrive at a PR with nothing on it. `findings` wakes the
      # coder that opened the PR (resolved server-side from its run_id);
      # `escalate` does not wake anyone and moves the Kanban card to
      # need_human with a sysadmin Telegram ping.
      #
      # The endpoint is idempotent on (repo, pr_number, head_sha, round,
      # event), so a re-run of this job is safe. This step is best-effort by
      # design (`continue-on-error`): a platform hiccup must not redden a PR
      # whose review and merge both went fine. The duplicate-safe endpoint is
      # what makes re-running this the correct recovery.
      - name: Report round outcome to AP-MT
        id: event
        if: >-
          always() && steps.findings.outcome == 'success' &&
          (needs.gate.outputs.round == '1' || needs.gate.outputs.round == '2')
        continue-on-error: true
        env:
          AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
          ROUND: ${{ needs.gate.outputs.round }}
          FINDINGS_COUNT: ${{ steps.findings.outputs.findings_count }}
          BLOCKING_COUNT: ${{ steps.findings.outputs.blocking_count }}
          # Carried into the payload so an `escalate` that happened only
          # because the judge omitted `blocks_merge` says so to the human it
          # pings, instead of reading as a real blocking finding. The inline
          # ::warning:: alone was invisible to anyone not reading this job log.
          MISSING_BLOCKS_MERGE: ${{ steps.findings.outputs.missing_blocks_merge }}
          ELIGIBLE: ${{ steps.findings.outputs.eligible }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ needs.gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${AW_DEVTEAM_EVENT_SECRET:-}" ]; then
            echo "::warning::AW_DEVTEAM_EVENT_SECRET is not set — the coder cannot be woken."
            exit 0
          fi
          round="$ROUND"
          if [ "$round" = "1" ] && [ "${FINDINGS_COUNT:-0}" -gt 0 ]; then
            event=findings
          elif [ "$round" = "2" ] && [ "${BLOCKING_COUNT:-0}" -gt 0 ]; then
            event=escalate
          else
            # Eligible: nothing to report here. The `merged` event comes from
            # the merged-event job when the PR actually closes.
            echo "nothing to report (round=$round eligible=$ELIGIBLE)"
            exit 0
          fi
          python3 - "$event" <<'PYEOF'
          import hashlib, hmac, json, os, subprocess, sys

          # See the "Post findings" step's own comment: RUNNER_TEMP, not a
          # bare /tmp name, is what keeps two concurrent jobs on this
          # self-hosted runner from clobbering each other's findings files.
          TMP = os.environ["RUNNER_TEMP"]

          event = sys.argv[1]
          payload = {
              "v": 1,
              "event": event,
              "repo": os.environ["REPO"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "pr_url": os.environ["PR_URL"],
              "head_sha": os.environ["HEAD_SHA"],
              "round": os.environ["ROUND"],
              "counts": json.load(open(os.path.join(TMP, "devteam_counts.json"))),
              "findings": json.load(open(os.path.join(TMP, "devteam_findings.json"))),
              "blocking": json.load(open(os.path.join(TMP, "devteam_blocking.json"))),
              "missing_blocks_merge": int(os.environ.get("MISSING_BLOCKS_MERGE") or 0),
          }
          # Sign the EXACT bytes that get posted — build once, write once,
          # sign the file's contents, send the file. Re-serializing between
          # signing and sending is how an HMAC ends up over different bytes
          # than the body. Signed in python rather than `openssl dgst -hmac
          # "$SECRET"` so the secret never appears in a process argv.
          raw = json.dumps(payload).encode()
          event_path = os.path.join(TMP, "devteam_event.json")
          response_path = os.path.join(TMP, "devteam_event_response.json")
          with open(event_path, "wb") as fh:
              fh.write(raw)
          sig = hmac.new(os.environ["AW_DEVTEAM_EVENT_SECRET"].encode(),
                         raw, hashlib.sha256).hexdigest()
          code = subprocess.run([
              "curl", "-sS", "--max-time", "60", "-o", response_path,
              "-w", "%{http_code}",
              "-X", "POST",
              "https://agents-platform.aw.tekflox.com/api/github/devteam-review-event",
              "-H", "Content-Type: application/json",
              "-H", f"X-Hub-Signature-256: sha256={sig}",
              "--data-binary", f"@{event_path}",
          ], capture_output=True, text=True, check=True).stdout.strip()
          body = open(response_path).read()
          print(f"{event} -> HTTP {code}: {body[:800]}")
          if not code.startswith("2"):
              print(f"::warning::devteam-review-event {event} returned HTTP {code}")
              sys.exit(1)
          PYEOF

  # ---------------------------------------------------------------------------
  # The merged half of the loop, on the real close event.
  #
  # Its own job, not a step in code-review above, because `--auto` means the
  # merge is usually only ENABLED there: the PR actually merges minutes later,
  # when the required checks go green, long after that job has exited. Keying
  # this off `pull_request: closed` + `merged == true` reports the merge when
  # it really happened — and, as a bonus, covers a human merging the PR by
  # hand, which is the case that leaves the shared tree stale today.
  #
  # No gate, no dispatch, no reviewer: this job only reports. It runs under the
  # same fork check as the gate, so a closed fork PR cannot reach it.
  # ---------------------------------------------------------------------------
  merged-event:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Report the merge to AP-MT
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The squash commit, not the PR head: it is what landed on master,
          # and it makes this delivery's idempotency key unique per merge.
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ -z "${AW_DEVTEAM_EVENT_SECRET:-}" ]; then
            echo "::warning::AW_DEVTEAM_EVENT_SECRET is not set — the coder will not be \
            woken to sync the shared tree."
            exit 0
          fi
          # Which round we finished on, for the record only — read live, same
          # reason as the gate.
          #
          # This one does NOT `exit 1` on a failed fetch, unlike the gate's,
          # and the asymmetry is deliberate rather than the oversight it looks
          # like. The gate's label read DECIDES CONTROL FLOW: guessing there
          # resets a mid-cycle PR to round 1 and can loop. Here it only fills
          # in a human-readable number in the wake prompt ("Merged after
          # review round: N") — the idempotency key uses the squash-merge SHA,
          # so an imprecise round cannot collide or double-dispatch. Failing
          # this job instead would mean the coder is never woken to sync the
          # shared tree, which is a strictly worse outcome than an unknown
          # round number. So: retry, then say `unknown` rather than assert a
          # round that may be false. (Reviewer finding on PR #13 — right that
          # the old code swallowed the error, and the fix is to stop lying,
          # not to start failing.)
          labels="__FETCH_FAILED__"
          for attempt in 1 2; do
            if labels="$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name')"; then
              break
            fi
            echo "::warning::label fetch attempt $attempt failed"
            labels="__FETCH_FAILED__"
            sleep 3
          done
          if [ "$labels" = "__FETCH_FAILED__" ]; then
            echo "::warning::could not read PR #$PR_NUMBER's labels — reporting round=unknown \
            rather than guessing. The merge itself is unaffected."
            round=unknown
          elif printf '%s\n' "$labels" | grep -Fxq "devteam:awaiting-fixes"; then
            round=2
          else
            round=1
          fi
          ROUND="$round" python3 <<'PYEOF'
          import hashlib, hmac, json, os, subprocess, sys

          # Same RUNNER_TEMP reasoning as the findings/escalate event block.
          TMP = os.environ["RUNNER_TEMP"]

          payload = {
              "v": 1,
              "event": "merged",
              "repo": os.environ["REPO"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "pr_url": os.environ["PR_URL"],
              "head_sha": os.environ["MERGE_SHA"],
              "round": os.environ["ROUND"],
              "counts": {},
          }
          raw = json.dumps(payload).encode()
          event_path = os.path.join(TMP, "devteam_event.json")
          response_path = os.path.join(TMP, "devteam_event_response.json")
          with open(event_path, "wb") as fh:
              fh.write(raw)
          sig = hmac.new(os.environ["AW_DEVTEAM_EVENT_SECRET"].encode(),
                         raw, hashlib.sha256).hexdigest()
          code = subprocess.run([
              "curl", "-sS", "--max-time", "60", "-o", response_path,
              "-w", "%{http_code}",
              "-X", "POST",
              "https://agents-platform.aw.tekflox.com/api/github/devteam-review-event",
              "-H", "Content-Type: application/json",
              "-H", f"X-Hub-Signature-256: sha256={sig}",
              "--data-binary", f"@{event_path}",
          ], capture_output=True, text=True, check=True).stdout.strip()
          body = open(response_path).read()
          print(f"merged -> HTTP {code}: {body[:800]}")
          if not code.startswith("2"):
              print(f"::warning::devteam-review-event merged returned HTTP {code}")
              sys.exit(1)
          PYEOF

# Repo-config steps for Frederico to run by hand (not commits):
#   gh variable set AW_REVIEW_TRUSTED_AUTHORS --body "fredericowu" --repo tekflox/aw-app-template
# Comma-separate to add more logins later. Leaving it unset is fine too --
# the gate job's own script defaults to "fredericowu" in code.
#
# The two round-state labels this file writes (both must exist; `gh api
# .../labels` 404s on an unknown name, which would fail the label step):
#   gh label create "devteam:awaiting-fixes" --repo tekflox/aw-app-template \
#     --color FBCA04 --description "Dev Team review round 1 posted findings; next /aw-review is round 2"
#   gh label create "devteam:needs-human" --repo tekflox/aw-app-template \
#     --color B60205 --description "Dev Team review round 2 still blocking - terminal until a human removes this"
#
# The two secrets:
#   AW_DEVTEAM_MERGE_TOKEN  — fine-grained PAT, THIS repo only, contents:write
#                             + pull-requests:write. Never GITHUB_TOKEN (see
#                             the merge step).
#   AW_DEVTEAM_EVENT_SECRET — shared HMAC secret; the same value lives in the
#                             AP-MT host's own .env under the same name.
#
# And the repo setting `--enable-auto-merge`, which `gh pr merge --auto` needs.
