name: Code Review

# Thin caller. The two-round PR review -> merge loop itself now lives in
# fredericowu/aw-shared-workflows — read that file's header for the round
# state machine, the fail-closed `blocks_merge` rule, the RUNNER_TEMP
# discipline, the trusted-author gate and why the merge uses a PAT and never
# GITHUB_TOKEN.
#
# This file USED to be that loop, ~1100 lines of it, and it was the original:
# AP-MT copy-adapted it, then aw-workspace core was about to become a third
# copy. That is what triggered the extraction. The shared workflow is a
# behaviour-preserving extraction of AP-MT's merged copy (2aab9cd5), which
# was this file plus fixes; a full non-comment diff of the two confirmed the
# only differences were the inputs below, two cosmetic banner strings, and
# the `--auto` note further down.
#
# ── WHY AN EXACT TAG, NOT @master ─────────────────────────────────────────
# `@v1.1.0` is immutable and never retagged. The cautionary precedent is in
# this very repo: `release.yml` calls
# `tekflox/aw-marketplace/.../app-release.yml@master`, a deliberately moving
# ref shared by ~45 app repos, and one fail-loud edit there reddened the whole
# marketplace at once. Bumps here are deliberate, one caller at a time.
#
# This repo is the designated CANARY for those bumps — the oldest and most
# exercised consumer. A new tag lands here first and is proven on a real PR
# before the other callers move. It earned that role twice over on its very
# first use, and BOTH bugs were ones only this repo could have surfaced:
#
#   v1.0.1  the merge gate's advisory set had lost `CodeRabbit` (see the
#           `ci_check_name` note below). Only this repo has that app
#           installed.
#   v1.1.0  `secrets: inherit` silently delivered an EMPTY
#           AW_CODEREVIEW_V1_KEY, because `inherit` does not cross an account
#           boundary and this repo is `tekflox/*` while the shared workflow
#           is `fredericowu/*`. The other two callers are same-owner and
#           inherited fine, so nothing else in the rollout would have caught
#           it. See the `secrets:` block at the bottom of this file.
#
# Neither v1.0.0 nor v1.0.1 was retagged; both remain published as they were.
#
# ── WHAT CHANGED IN BEHAVIOUR, DELIBERATELY ───────────────────────────────
# One thing, decided and not to be relitigated here: the merge is now a plain
# `gh pr merge --squash`, where this file previously used `--squash --auto`.
# `--auto` only pauses for checks that BRANCH PROTECTION marks required, and
# this repo has none (verified 2026-11-04: the protection API returns
# "Branch not protected"), so it was never actually waiting on anything. The
# shared workflow's `ci_gate` does that job explicitly instead, and the merge
# step runs only once it has SUCCEEDED — so the head SHA is already green by
# then. Direct push to master stays available as the break-glass path.
#
# ── WHAT DID NOT CHANGE ───────────────────────────────────────────────────
# `ai-review.yml` is not touched by this change, at all — same as when this
# file was first added. The two are deliberately SEPARATE workflows rather
# than jobs in one file: ai-review.yml's `concurrency` is evaluated at the
# WORKFLOW level, before any job `if`, which is the exact mechanism behind the
# 809a1a6 incident where CodeRabbit's own auto-comment landed in that group
# and cancelled PR-Agent's in-flight run. This file's concurrency group below
# shares no prefix with ai-review's, so that cancellation class stays
# impossible BY CONSTRUCTION. Keeping the caller a separate file preserves
# that property exactly.
#
# The trigger surface still deliberately excludes `synchronize`: a full deep
# review (one judge run plus up to 3 research runs) costs real subscription
# budget, and PR-Agent already reviews every push. Re-triggering after
# further pushes is `/aw-review` on demand. `/aw-improve` remains the
# lighter-weight sibling command — both are parsed by the shared workflow's
# gate, unchanged.
#
# ── ONE TRAP, IF YOU ARE EDITING *THIS FILE* IN A PR ──────────────────────
# `pull_request` runs this file's PR copy (round 1 sees your edits live);
# `issue_comment` (`/aw-review`, round 2) always runs the DEFAULT BRANCH's
# copy. So the PR that introduces this conversion — and any later PR that only
# bumps the `@vX.Y.Z` pin — CANNOT exercise its own round 2. Verify round 2 on
# the NEXT PR after merge; don't burn time "debugging" that.

on:
  pull_request:
    # `closed` is here only for the shared workflow's merged-event job; its
    # gate job excludes `closed` explicitly, so a close never dispatches a
    # review.
    types: [opened, reopened, ready_for_review, closed]
  issue_comment:
    types: [created]

# Stays in the caller, not in the reusable workflow, for two reasons: a
# reusable workflow's own `concurrency` would key on the SHARED file's
# identity (collapsing unrelated repos into one queue), and this specific
# group string is load-bearing here — see the ai-review.yml note above.
concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    uses: fredericowu/aw-shared-workflows/.github/workflows/code-review-reusable.yml@v1.1.0
    with:
      # test.yml's job id on this repo. Verified against real `gh pr checks`
      # output (PRs #13-15), not read off the YAML — `ui-lint` is a second job
      # there and `coverage` is the one that matters.
      #
      # That same verification is what found the v1.0.0 bug: this repo's PRs
      # also carry a `CodeRabbit` check, which this file's own ADVISORY set
      # listed and the v1.0.0 extraction had dropped (its source was AP-MT,
      # which has no CodeRabbit). It sits `pending` while CodeRabbit reviews,
      # so on v1.0.0 the merge gate would have waited on it and then refused
      # at the 20-minute deadline. Fixed in v1.0.1, pinned above.
      ci_check_name: coverage
      # `runs_on` left at its default (`"ubuntu-latest"`), which is what all
      # three `runs-on:` lines in the pre-conversion file said. Note this
      # repo's test.yml derives ITS runner from the repo owner
      # (`startsWith(github.repository, 'tekflox/')`); code-review never did,
      # and this conversion does not change that.
    # Declared here as well as in the called workflow: for a reusable workflow
    # the effective GITHUB_TOKEN permissions are the INTERSECTION of the two.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    # Passed BY NAME, never `secrets: inherit`. `inherit` does not cross an
    # ACCOUNT boundary — GitHub: "workflows that call reusable workflows in
    # the same organization or enterprise can use the `inherit` keyword" —
    # and when it does not apply it fails SILENTLY, yielding an empty string
    # rather than an error.
    #
    # Measured on THIS repo, PR #16: with `inherit`, AW_CODEREVIEW_V1_KEY
    # arrived at the shared workflow as an EMPTY STRING even though it IS set
    # here — because this repo is `tekflox/*` and the shared workflow is
    # `fredericowu/*`. Named passing is ownership-independent.
    #
    # The shared workflow still reads each with an explicit fail-loud branch
    # for "unset", so a genuinely missing one names itself in CI. All three
    # are already set on this repo.
    secrets:
      AW_CODEREVIEW_V1_KEY: ${{ secrets.AW_CODEREVIEW_V1_KEY }}
      AW_DEVTEAM_MERGE_TOKEN: ${{ secrets.AW_DEVTEAM_MERGE_TOKEN }}
      AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
